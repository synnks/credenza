name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          check-latest: true
          cache: sbt
          cache-read-only: true

      - uses: sbt/setup-sbt@v1.5.13

      - name: Check formatting
        run: sbt --server --batch "; scalafmtSbtCheck; scalafmtCheckAll"

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          check-latest: true
          cache: sbt
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - uses: sbt/setup-sbt@v1.5.13

      - name: Compile and run full tests
        run: sbt --server --batch "; compile; testFull"

      - name: JVM integration tests
        run: sbt --server --batch integrationTest

  greenlight:
    if: always()
    needs: [format, test]
    runs-on: ubuntu-latest

    steps:
      - name: Require all checks to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: jq --exit-status 'length > 0 and all(.[]; .result == "success")' <<< "$JOB_RESULTS"
