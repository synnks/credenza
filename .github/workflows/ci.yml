name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      LLVM_BIN: /usr/lib/llvm-18/bin
      SCALANATIVE_INCLUDE_DIRS: /home/linuxbrew/.linuxbrew/include:/home/linuxbrew/.linuxbrew/opt/openssl@3/include
      SCALANATIVE_LIB_DIRS: /home/linuxbrew/.linuxbrew/lib:/home/linuxbrew/.linuxbrew/opt/openssl@3/lib
      LD_LIBRARY_PATH: /home/linuxbrew/.linuxbrew/lib:/home/linuxbrew/.linuxbrew/opt/openssl@3/lib

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - uses: sbt/setup-sbt@v1.5.11

      - name: Install Native libraries
        run: /home/linuxbrew/.linuxbrew/bin/brew install --force-bottle s2n openssl@3

      - name: Check and test
        run: sbt --batch "; scalafmtSbtCheck; scalafmtCheckAll; compile; testFull"
