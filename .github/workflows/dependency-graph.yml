name: Dependency graph

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  dependency-graph:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          check-latest: true
          cache: sbt
          cache-read-only: true

      - uses: sbt/setup-sbt@v1.5.14

      - name: Submit dependency graph
        uses: scalacenter/sbt-dependency-submission@v3.2.3
        with:
          sbt-plugin-version: "3.2.3"
