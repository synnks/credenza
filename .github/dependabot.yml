version: 2

updates:
  - package-ecosystem: sbt
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      sbt-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
